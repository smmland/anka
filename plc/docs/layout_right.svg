<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Tahoma, Vazirmatn, sans-serif">
  <!-- Top view: Right section (separate) + Main/Control section (shared) -->
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="600" y="30" text-anchor="middle" font-size="20" font-weight="bold">ANKA – Top View · Right Section + Main Section (K508-40AX + 2× K523-16DR)</text>

  <!-- machine frame (right half) -->
  <path d="M20 60 H1120 a40 40 0 0 1 40 40 V740 a40 40 0 0 1 -40 40 H20" fill="none" stroke="#b5a22a" stroke-width="10"/>
  <line x1="20" y1="300" x2="1160" y2="300" stroke="#000" stroke-width="4"/>
  <text x="1150" y="292" text-anchor="end" font-size="11">rail / divider</text>

  <!-- shared middle section: conveyor -->
  <rect x="30" y="250" width="200" height="520" rx="24" fill="#02a03f"/>
  <text x="130" y="520" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Conveyor</text>
  <text x="130" y="540" text-anchor="middle" font-size="12" fill="#fff">(Middle – shared)</text>
  <text x="130" y="558" text-anchor="middle" font-size="12" fill="#fff">SW1 %I3.4 ON/OFF</text>

  <!-- ===== Main / control section ===== -->
  <!-- Status board -->
  <rect x="400" y="75" width="95" height="215" rx="6" fill="#333"/>
  <circle cx="447" cy="115" r="24" fill="#ff0000"/>
  <circle cx="447" cy="180" r="24" fill="#ffa500"/>
  <circle cx="447" cy="245" r="24" fill="#00f25a"/>
  <text x="447" y="70" text-anchor="middle" font-size="13" font-weight="bold">Status Board</text>
  <g font-size="11" text-anchor="end">
    <text x="392" y="112">QR_Light_R</text><text x="392" y="125" fill="#555">%Q2.1</text>
    <text x="392" y="177">QR_Light_O</text><text x="392" y="190" fill="#555">%Q3.2</text>
    <text x="392" y="242">QR_Light_G</text><text x="392" y="255" fill="#555">%Q2.0</text>
  </g>

  <!-- Control board -->
  <rect x="505" y="75" width="200" height="215" rx="6" fill="#c1b8b5"/>
  <text x="605" y="70" text-anchor="middle" font-size="13" font-weight="bold">Control Board</text>
  <!-- selector switches -->
  <circle cx="535" cy="105" r="17" fill="#fff" stroke="#000" stroke-width="4"/>
  <circle cx="535" cy="160" r="17" fill="#333" stroke="#000" stroke-width="4"/>
  <circle cx="535" cy="210" r="17" fill="#333" stroke="#000" stroke-width="4"/>
  <circle cx="535" cy="260" r="17" fill="#333" stroke="#000" stroke-width="4"/>
  <g font-size="10">
    <text x="557" y="103">ON/OFF</text>
    <text x="557" y="158">SW3</text><text x="557" y="170" fill="#444">%I3.2</text>
    <text x="557" y="208">SW2</text><text x="557" y="220" fill="#444">%I3.3</text>
    <text x="557" y="258">SW1</text><text x="557" y="270" fill="#444">%I3.4</text>
  </g>
  <!-- mushroom / start / stop / pedal -->
  <circle cx="670" cy="105" r="18" fill="#d32f2f" stroke="#fff" stroke-width="4"/>
  <text x="670" y="138" text-anchor="middle" font-size="10">Fungal %I2.1</text>
  <rect x="612" y="160" width="28" height="30" rx="3" fill="#1fc000" stroke="#333"/>
  <rect x="644" y="160" width="28" height="30" rx="3" fill="#b00000" stroke="#333"/>
  <text x="626" y="203" text-anchor="middle" font-size="9">Start</text>
  <text x="626" y="214" text-anchor="middle" font-size="9">%I2.3</text>
  <text x="658" y="203" text-anchor="middle" font-size="9">Stop</text>
  <text x="658" y="214" text-anchor="middle" font-size="9">%I2.2</text>
  <circle cx="670" cy="255" r="17" fill="#f7cf00" stroke="#000" stroke-width="3"/>
  <text x="640" y="283" text-anchor="middle" font-size="10">Pedal %I2.6</text>

  <!-- Main air valve -->
  <rect x="760" y="110" width="150" height="60" rx="8" fill="#e0f0ff" stroke="#0033ff" stroke-width="2"/>
  <text x="835" y="135" text-anchor="middle" font-size="12" font-weight="bold">Main Air Valve</text>
  <text x="835" y="155" text-anchor="middle" font-size="11">QM_Main  %Q3.1</text>

  <!-- ===== Right section ===== -->
  <!-- TN4 / TN3 fingers (top) -->
  <rect x="520" y="318" width="200" height="22" rx="4" fill="#f55304"/>
  <text x="620" y="334" text-anchor="middle" font-size="13" font-weight="bold">TN4</text>
  <rect x="495" y="348" width="200" height="22" rx="4" fill="#f55304"/>
  <text x="595" y="364" text-anchor="middle" font-size="13" font-weight="bold">TN3</text>

  <!-- HRQ1 rotary -->
  <circle cx="505" cy="455" r="75" fill="#c205c8"/>
  <text x="505" y="460" text-anchor="middle" font-size="15" font-weight="bold">HRQ1</text>
  <!-- TN1 main -->
  <rect x="582" y="415" width="100" height="80" rx="4" fill="#f55304"/>
  <text x="632" y="460" text-anchor="middle" font-size="15" font-weight="bold">TN1</text>
  <!-- Griper1 -->
  <rect x="682" y="425" width="68" height="58" rx="4" fill="#0033ff"/>
  <text x="716" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Griper1</text>
  <!-- TN2 blade -->
  <rect x="495" y="540" width="200" height="22" rx="4" fill="#f55304"/>
  <text x="595" y="556" text-anchor="middle" font-size="13" font-weight="bold">TN2</text>

  <!-- Griper4 (far right) -->
  <rect x="960" y="305" width="190" height="40" rx="4" fill="#c62b2e"/>
  <rect x="1022" y="345" width="66" height="52" rx="4" fill="#0033ff"/>
  <text x="1055" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Griper4</text>

  <!-- I/O callouts right section -->
  <g font-size="11" fill="#222">
    <line x1="720" y1="329" x2="775" y2="329" stroke="#888"/>
    <text x="780" y="326">TN4 finger top  · Q %Q0.5 · I %I0.4</text>
    <text x="780" y="339" fill="#b00">default depends on SW2</text>
    <line x1="695" y1="359" x2="775" y2="365" stroke="#888"/>
    <text x="780" y="369">TN3 finger bottom · Q %Q0.4 · I %I0.3</text>
    <line x1="750" y1="440" x2="775" y2="420" stroke="#888"/>
    <text x="780" y="416">Griper1 (main) · Q %Q0.1 · I %I0.0</text>
    <line x1="682" y1="470" x2="775" y2="460" stroke="#888"/>
    <text x="780" y="456">TN1 main · Q %Q0.2 · I %I0.1</text>
    <line x1="695" y1="551" x2="775" y2="551" stroke="#888"/>
    <text x="780" y="555">TN2 blade · Q %Q0.3 · I %I0.2</text>
    <line x1="440" y1="510" x2="330" y2="600" stroke="#888"/>
    <text x="250" y="615">HRQ1 rotary · Q %Q0.6</text>
    <text x="250" y="630">open %I0.6 · close %I0.7</text>
    <line x1="1055" y1="397" x2="1055" y2="420" stroke="#888"/>
    <text x="1055" y="435" text-anchor="middle">Griper4 · Q %Q0.0 · (no sensor)</text>
  </g>

  <!-- summary box -->
  <rect x="780" y="600" width="360" height="160" rx="8" fill="#f7f7f7" stroke="#bbb"/>
  <g font-size="11">
    <text x="795" y="622" font-weight="bold">Modules / address ranges (assumed)</text>
    <text x="795" y="642">CPU K508-40AX : %I0.0–%I2.7 · %Q0.0–%Q1.7</text>
    <text x="795" y="660">EXP1 K523-16DR: %I3.0–%I3.7 · %Q2.0–%Q2.7</text>
    <text x="795" y="678">EXP2 K523-16DR: %I4.0–%I4.7 · %Q3.0–%Q3.7</text>
    <text x="795" y="700" font-weight="bold">Right: 7 valves + 3 lights · Main: 1 valve</text>
    <text x="795" y="720">All valves: single solenoid, spring return</text>
    <text x="795" y="738">RS232 (PORT0) → Raspberry Pi (Modbus RTU, planned)</text>
  </g>
</svg>
